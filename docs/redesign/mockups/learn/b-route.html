<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn · B Route</title>
<link rel="stylesheet" href="learn.css">
<style>
/* B Route: the five levels as one line through the page. Every lesson is a stop on it, so the order is visible. */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(20px,4vw,48px) clamp(28px,4vw,48px)}
.tools{display:flex;flex-direction:column;gap:16px;padding:clamp(18px,2.4vw,28px);border-radius:28px;background:#fff;border:1px solid var(--edge);box-shadow:0 18px 50px oklch(30% 0.04 220 / .08)}
.tools .refs{padding-top:4px;border-top:1px solid var(--soft-2);margin-top:2px}
.tools .refs a{min-height:40px}
#resume:empty{display:none}
.under{display:flex;justify-content:space-between;align-items:center;margin:26px 0 22px}

.route{--gap:76px;--lx:24px;position:relative;padding-left:var(--gap)}
.line{position:absolute;left:calc(var(--lx) - 1.5px);top:30px;bottom:30px;width:3px;border-radius:2px;background:var(--soft-2)}
.line i{position:absolute;left:0;top:0;width:100%;height:var(--prog,0px);background:var(--accent);border-radius:2px;transition:height .6s var(--ease)}
.filtering .line i{opacity:0}

.lvl{position:relative;margin-top:clamp(36px,5vw,64px)}
.lvl:first-of-type{margin-top:0}
.lvl-head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 28px;align-items:center;padding:clamp(20px,2.6vw,32px) clamp(20px,3vw,36px);border-radius:28px;background:var(--soft)}
.lvl.now .lvl-head{background:var(--oasis)}
.lvl.done .lvl-head{background:var(--teal-tint)}
.node{position:absolute;left:calc(-1 * var(--gap) + var(--lx) - 23px);top:50%;margin-top:-23px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:600;font-size:1.25rem;box-shadow:0 0 0 6px var(--page)}
.lvl.done .node{background:var(--accent)}
.lvl.later .node{background:#fff;color:var(--ink);box-shadow:0 0 0 6px var(--page),inset 0 0 0 2px var(--ink)}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
.title-row h2{margin:0;font-size:clamp(1.5rem,1.2rem + 1vw,2rem);font-weight:600;letter-spacing:-.035em;line-height:1.1}
.title-row .ar{font-size:1.625rem;line-height:1.4;color:var(--accent)}
.blurb{margin:6px 0 0;color:oklch(30% 0.025 230);max-width:34em}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.meta .assume{max-width:22em;color:oklch(33% 0.025 230)}
.lvl-head .fold{grid-column:2;grid-row:1;justify-self:end}
.lvl-body{padding-top:22px}

.grp{position:relative;margin-top:26px}
.grp:first-child{margin-top:0}
.grp::before{content:"";position:absolute;left:calc(-1 * var(--gap) + var(--lx) - 9px);top:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 5px var(--page)}
.grp.all::before{border-color:var(--accent);background:var(--accent)}
.grp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0 12px 6px}
.grp-h h3{margin:0;font-size:1.125rem;font-weight:600;letter-spacing:-.015em}
.grp-h span{font-size:.9375rem;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:2px}
.row::after{content:"";position:absolute;left:calc(-1 * var(--gap) + var(--lx) - 6px);top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid oklch(78% 0.015 230);box-shadow:0 0 0 4px var(--page);transition:transform .2s var(--ease)}
.row:hover::after{transform:scale(1.25)}
.row.done::after{background:var(--accent);border-color:var(--accent)}
.row.next::after{background:var(--accent-2);border-color:var(--accent-2);width:16px;height:16px;margin-top:-8px;left:calc(-1 * var(--gap) + var(--lx) - 8px);box-shadow:0 0 0 4px var(--page),0 0 0 7px oklch(58% 0.15 58 / .3)}
.lvl.later .row .n{background:#fff;box-shadow:inset 0 0 0 1.5px var(--edge)}

.filtering .intro>div:first-child,.filtering #resume,.filtering .tools .refs{display:none}
.filtering .intro{grid-template-columns:1fr;padding-block:8px 0}
.filtering .lvl-body{display:block!important}
.filtering .lvl-head .blurb,.filtering .lvl-head .meta{display:none}
.filtering .lvl-head{padding-block:14px}
.filtering .lvl{margin-top:20px}
.filtering .row::after,.filtering .grp::before{display:none}

@media (max-width:900px){.intro{grid-template-columns:1fr;align-items:start}}
@media (max-width:760px){
  .route{--gap:44px;--lx:14px}
  .node{width:32px;height:32px;margin-top:-16px;left:calc(-1 * var(--gap) + var(--lx) - 16px);font-size:1rem;box-shadow:0 0 0 4px var(--page)}
  .lvl.later .node{box-shadow:0 0 0 4px var(--page),inset 0 0 0 2px var(--ink)}
  .grp::before{width:14px;height:14px;left:calc(-1 * var(--gap) + var(--lx) - 7px);box-shadow:0 0 0 4px var(--page)}
  .row::after{left:calc(-1 * var(--gap) + var(--lx) - 5px);width:10px;height:10px;margin-top:-5px;box-shadow:0 0 0 3px var(--page)}
  .row.next::after{left:calc(-1 * var(--gap) + var(--lx) - 7px);width:14px;height:14px;margin-top:-7px}
  .lvl-head{grid-template-columns:minmax(0,1fr) auto;padding:16px 16px 16px 18px;border-radius:22px}
  .meta{grid-column:1 / -1;align-items:flex-start;text-align:left}
  .lvl-head .blurb{display:none}
  .lvl[data-collapsed="true"] .lvl-body,.lvl[data-collapsed="true"] .meta{display:none}
  .title-row .ar{font-size:1.25rem}
  .lvl-body{padding-top:14px}
}
</style></head>
<body>
<header class="site">
  <a class="brand" href="#" aria-label="Quranic Grammar, home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="oklch(18% 0.03 240)"/><path d="M9 19h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2.6" fill="oklch(79% 0.14 72)"/><circle cx="16" cy="24.5" r="1.6" fill="#fff"/></svg><span>Quranic Grammar</span></a>
  <nav aria-label="Primary"><a href="#" aria-current="page">Learn</a><a href="#">Surahs</a><a href="#">Resources</a><a href="#">About</a></nav>
</header>

<main class="wrap" id="main">
  <section class="intro" aria-labelledby="h">
    <div>
      <h1 class="h1" id="h">Every lesson, in the order it is taught.</h1>
      <p class="dek" id="dek"></p>
    </div>
    <div class="tools" id="tools"></div>
  </section>
  <div id="resume"></div>
  <div class="under"><p class="count" id="count" aria-live="polite"></p></div>
  <div id="list" class="route"><div class="line" aria-hidden="true"><i></i></div></div>
</main>
<footer class="foot"><span>Quranic Grammar</span><a href="#">Surahs</a><a href="#">Resources</a><a href="#">About and feedback</a></footer>

<script src="learn-data.js"></script>
<script src="learn.js"></script>
<script>
const U = LearnUI, L = U.L;
document.querySelector('#dek').textContent = `${L.total} lessons in ${L.levels.length} levels. Begin at Level 1, or type a topic such as “cases” to find it. Nothing is locked.`;
document.querySelector('#tools').innerHTML = U.findHTML() + U.chipsHTML() + '<p class="refs"><span>Reference tools</span> <a href="#">Verb forms</a> <a href="#">I‘rab cases</a></p>';
document.querySelector('#resume').innerHTML = U.resumeHTML();
const cur = U.next ? U.next.level : 6;
const list = document.querySelector('#list');
list.insertAdjacentHTML('beforeend', L.levels.map(l => {
  const s = U.stats(l.n);
  const state = s.done === s.total ? 'done' : l.n === cur ? 'now' : s.done > 0 ? 'now' : 'later';
  const prog = s.done === 0 ? `0 of ${s.total} done` : s.done === s.total ? `All ${s.total} done` : `${s.done} of ${s.total} done`;
  return `<section class="lvl ${state}" data-level="${l.n}" aria-labelledby="l${l.n}">
    <div class="lvl-head">
      <span class="node" aria-hidden="true">${l.n}</span>
      <div>
        <div class="title-row"><h2 id="l${l.n}"><span class="vh">Level ${l.n}: </span>${l.title}</h2><span class="ar" lang="ar" dir="rtl">${l.ar}</span></div>
        <p class="blurb">${l.blurb}</p>
      </div>
      <div class="meta"><p class="assume">${l.needs}</p><div class="prog" style="--p:${Math.round(100 * s.done / s.total)}%"><i><s></s></i><span>${prog}</span></div></div>
      <button class="fold" type="button" aria-expanded="true" aria-controls="b${l.n}">${U.ICON.chev}<span class="vh">Show or hide Level ${l.n}</span></button>
    </div>
    <div class="lvl-body" id="b${l.n}">
      ${l.clusters.map(c => { const all = c.lessons.every(x => U.byId[x.id].done); return `<div class="grp${all ? ' all' : ''}"><div class="grp-h"><h3>${U.esc(c.title)}</h3><span>${c.note ? U.esc(c.note) : `${c.lessons.length} ${c.lessons.length === 1 ? 'lesson' : 'lessons'}`}</span></div>
        <div class="rows">${c.lessons.map(x => U.rowHTML(U.byId[x.id])).join('')}</div></div>`; }).join('')}
      ${U.moreHTML(l)}
    </div>
  </section>`;
}).join('') + U.emptyHTML());

// The filled part of the line runs down to the next lesson.
function fill() {
  const bar = list.querySelector('.line i');
  const n = list.querySelector('.row.next');
  const first = list.querySelector('.node');
  const top0 = list.getBoundingClientRect().top;
  if (first) list.querySelector('.line').style.top = (first.getBoundingClientRect().top + first.offsetHeight / 2 - top0) + 'px';
  if (!n || n.offsetParent === null) { bar.style.setProperty('--prog', U.doneN ? '100%' : '0px'); return; }
  const top = list.getBoundingClientRect().top;
  const y = n.getBoundingClientRect().top + n.offsetHeight / 2 - top;
  bar.style.setProperty('--prog', Math.max(0, y - parseFloat(list.querySelector('.line').style.top || 30)) + 'px');
}
U.wire(() => requestAnimationFrame(fill));
addEventListener('resize', fill);
document.fonts.ready.then(fill);
</script>
</body></html>
