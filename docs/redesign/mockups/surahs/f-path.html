<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surahs · F Path</title>
<link rel="stylesheet" href="surahs.css">
<style>
/* F Path: the page starts from you. Say how far you are in the course; the staircase shows how many surahs that opens, and the page
   puts the ones you can read now first, then the next goal. Nothing is locked, and nothing here is a game: it is plain progress. */
.hero{margin-top:8px;border-radius:36px;background:var(--oasis);padding:clamp(22px,4vw,56px) clamp(16px,4vw,56px) clamp(18px,3vw,40px)}
.hero .h1{max-width:none}
.hero .dek{color:oklch(31% 0.03 230);max-width:36em}

/* the staircase is the question */
.ask{margin-top:clamp(22px,3vw,36px)}
.ask > p{margin:0 0 10px;font-size:.9375rem;font-weight:500;color:oklch(31% 0.03 230)}
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.2vw,14px);align-items:end}
.st{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:0;border:0;background:none;cursor:pointer;text-align:left;border-radius:20px}
.st .bar{display:flex;align-items:flex-start;justify-content:space-between;height:calc(44px + var(--h) * 116px);padding:12px 14px;border-radius:18px 18px 8px 8px;background:oklch(100% 0 0 / .6);box-shadow:inset 0 0 0 1.5px oklch(100% 0 0 / .9);transform-origin:bottom;transition:background-color .35s,box-shadow .35s,transform .25s var(--ease);font-variant-numeric:tabular-nums}
.st .bar b{font-size:1.375rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.st .bar small{font-size:.8125rem;font-weight:500;line-height:1.3;opacity:.85}
.st .lbl{display:flex;flex-direction:column;padding-inline:4px;line-height:1.25}
.st .lbl b{font-weight:600;font-size:1rem}
.st .lbl .sh{display:none}
.st .lbl span{font-size:.875rem;color:oklch(33% 0.03 230)}
.st:hover .bar{transform:translateY(-3px)}
.st:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.st.on .bar{background:var(--accent);color:#fff;box-shadow:none}
.st.next .bar{background:var(--amber-tint);box-shadow:inset 0 0 0 2px var(--accent-2),0 0 0 0 transparent;color:var(--ink)}
.st.next .bar small{color:var(--accent-2-text);opacity:1}
.st[aria-checked="true"] .lbl b::after{content:"You are here";display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:.75rem;font-weight:500;vertical-align:1px}
.stairs.enter .bar{animation:rise .7s var(--ease) both;animation-delay:calc(var(--k) * 70ms)}
@keyframes rise{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}

/* result */
.res{padding-top:clamp(28px,4vw,52px)}
.res-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 32px}
.res-h h2{margin:0;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.5rem);font-weight:600;letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.res-h p{margin:8px 0 0;max-width:40em;color:var(--muted)}
.res-h .find{flex:0 1 340px}
.res-h .find input{min-height:52px}

.feature{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);margin-top:clamp(20px,3vw,32px);padding:clamp(22px,3.5vw,44px);border-radius:32px;background:var(--teal-tint);box-shadow:inset 0 0 0 1px oklch(86% 0.05 178)}
.feature .tags{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:8px}
.feature .nm{display:block;font-size:clamp(3.5rem,2.4rem + 4.2vw,6.25rem);line-height:1.3;text-align:left;color:var(--ink)}
.feature .en{margin:4px 0 0;font-size:1.5rem;font-weight:600;letter-spacing:-.03em}
.feature .meta{margin:2px 0 0;color:oklch(35% 0.04 200)}
.feature .right{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.feature .op{margin:0;font-size:clamp(2rem,1.5rem + 1.8vw,3rem);line-height:1.9;text-align:right;color:var(--text)}
.feature .nt{margin:0;color:oklch(28% 0.04 200);max-width:42ch}
.feature .nt .ar{font-size:1.2em}
.feature .made{display:flex;flex-direction:column;gap:8px}
.feature .made .comp{height:8px;background:oklch(100% 0 0 / .6)}
.feature .made p{margin:0;font-size:.9375rem;color:oklch(28% 0.04 200)}
.feature .act{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}

.sub{margin:clamp(30px,4vw,48px) 0 6px;font-size:1.125rem;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sub span{font-weight:400;font-size:.9375rem;color:var(--muted);letter-spacing:0}
.rw{display:grid;grid-template-columns:minmax(130px,210px) minmax(0,1fr) minmax(0,1.2fr) 36px;align-items:center;column-gap:clamp(12px,2.5vw,32px);padding:14px 14px;border-top:1px solid var(--soft-2);text-decoration:none;transition:background-color .18s}
.rw:first-of-type{border-top-color:transparent}
.rw:hover{background:var(--soft);border-radius:18px;border-top-color:transparent}
.rw:hover + .rw{border-top-color:transparent}
.rw .nm{font-size:2.5rem;line-height:1.4;color:var(--ink);text-align:left}
.rw .t b{display:block;font-weight:600;font-size:1.125rem;letter-spacing:-.015em}
.rw .t span{font-size:.9375rem;color:var(--muted)}
.rw .op{font-size:1.625rem;line-height:1.9;text-align:right;color:var(--text)}
.rw .go{justify-self:end;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:background-color .18s,color .18s}
.rw .go svg{width:18px;height:18px}
.rw:hover .go{background:var(--ink);color:#fff}

.goal{margin-top:clamp(30px,4vw,48px);padding:clamp(22px,3.5vw,40px);border-radius:32px;background:var(--amber-tint);box-shadow:inset 0 0 0 1px oklch(86% 0.08 78)}
.goal h3{margin:0;font-size:clamp(1.375rem,1.1rem + 1vw,1.875rem);font-weight:600;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.goal p{margin:8px 0 0;color:oklch(33% 0.04 70);max-width:38em}
.cloud{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 24px;padding:0;list-style:none}
.cloud a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:96px;min-height:88px;padding:6px 16px 8px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1.5px oklch(88% 0.06 78);text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s}
.cloud a:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--ink),0 10px 20px -10px oklch(30% 0.05 70 / .4)}
.cloud .ar{font-size:1.75rem;line-height:1.7;color:var(--ink)}
.cloud small{font-size:.8125rem;color:var(--muted);line-height:1.2}
.cloud li[hidden]{display:none}

.ahead{margin:0;padding:0;list-style:none}
.ahead li{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr);gap:8px 32px;padding:18px 4px;border-top:1px solid var(--soft-2);align-items:start}
.ahead li:first-child{border-top-color:transparent}
.ahead h4{margin:0;font-size:1rem;font-weight:600}
.ahead h4 span{display:block;margin-top:2px;font-size:.9375rem;font-weight:400;color:var(--muted)}
.ahead .names{display:flex;flex-wrap:wrap;gap:2px 6px;direction:rtl;justify-content:flex-end}
.ahead .names a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:14px;font-size:1.625rem;line-height:1.4;text-decoration:none;color:var(--ink)}
.ahead .names a:hover{background:var(--soft)}
.ahead .names a[hidden]{display:none}

.rw[hidden],.feature[hidden]{display:none}
.filtering .ask,.filtering .hero .dek,.filtering .sub{display:none}
.filtering .hero{padding-block:18px}
.filtering .hero .h1{font-size:clamp(1.5rem,1.2rem + 1vw,2rem)}

@media (max-width:900px){
  .feature{grid-template-columns:1fr}
  .feature .op{text-align:left}
  .ahead li{grid-template-columns:1fr}
  .ahead .names{justify-content:flex-start}
}
@media (max-width:700px){
  .rw{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t nm" "op op";padding:14px 6px;row-gap:0}
  .rw .t{grid-area:t}.rw .nm{grid-area:nm;font-size:2.25rem}.rw .op{grid-area:op;font-size:1.5rem}.rw .go{display:none}
}
@media (max-width:640px){
  .hero{border-radius:26px;padding:20px 14px 16px}
  .hero .h1{font-size:2rem}
  .hero .dek{display:none}
  .ask{margin-top:14px}
  .ask > p{margin-bottom:8px}
  .st .bar{height:calc(40px + var(--h) * 84px);padding:8px 6px;border-radius:12px 12px 6px 6px}
  .st .bar b{font-size:1.0625rem}
  .st .bar small{display:none}
  .st .lbl span{display:none}
  .st .lbl b{font-size:.8125rem;white-space:nowrap}
  .st .lbl .lg{display:none}.st .lbl .sh{display:inline}
  .st[aria-checked="true"] .lbl b::after{display:none}
  .st[aria-checked="true"] .lbl b{text-decoration:underline;text-underline-offset:4px}
  .stairs{gap:5px}
  .res-h .find{flex-basis:100%}
  .feature{border-radius:24px;padding:18px}
  .goal{border-radius:24px;padding:18px}
  .cloud a{min-width:84px}
}
</style></head>
<body>
<a class="skip" href="#res">Skip to the surahs</a>
<header class="site">
  <a class="brand" href="#" aria-label="Quranic Grammar, home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="oklch(18% 0.03 240)"/><path d="M9 19h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2.6" fill="oklch(79% 0.14 72)"/><circle cx="16" cy="24.5" r="1.6" fill="#fff"/></svg><span>Quranic Grammar</span></a>
  <nav aria-label="Primary"><a href="#">Learn</a><a href="#" aria-current="page">Surahs</a><a href="#">Resources</a><a href="#">About</a></nav>
</header>

<main class="wrap" id="main">
  <section class="hero" aria-labelledby="h">
    <h1 class="h1" id="h">Which surahs can you read today?</h1>
    <p class="dek">Choose how far you are in the course. We show the surahs your grammar already prepares you for.</p>
    <div class="ask">
      <p id="askl">How far are you in the course?</p>
      <div class="stairs enter" id="stairs" role="radiogroup" aria-labelledby="askl"></div>
    </div>
  </section>

  <section class="res" id="res" aria-labelledby="rh">
    <div class="res-h">
      <div><h2 id="rh"></h2><p id="rs"></p></div>
      <div id="tools"></div>
    </div>
    <p class="count" id="count" aria-live="polite" style="margin-top:10px"></p>
    <div id="out"></div>
    <div id="emptyhost"></div>
  </section>
</main>
<footer class="foot"><span>Quranic Grammar</span><a href="#">Learn</a><a href="#">Resources</a><a href="#">About and feedback</a></footer>

<script src="surahs-data.js"></script>
<script src="surahs.js"></script>
<script>
// ?done=0 to 5 sets how many levels are finished (the built page reads the learner's saved progress).
const U = SurahUI, D = U.D, S = U.S, esc = U.esc;
const LV = D.levels.length;
const params = new URLSearchParams(location.search);
let done = params.has('done') ? Math.min(LV, Math.max(0, +params.get('done') || 0)) : 2;
const cum = n => S.filter(s => s.level <= n).length;
const at = n => S.filter(s => s.level === n);
const q = id => document.querySelector(id);

q('#tools').innerHTML = U.findHTML('Find a surah', 'out');
q('#emptyhost').innerHTML = U.emptyHTML();

// The staircase: one step per stage, as tall as the number of surahs that stage opens
const STAGES = [{ n: 0, name: 'Just starting' }, ...D.levels.map(l => ({ n: l.n, name: `Level ${l.n} finished`, short: `Level ${l.n}`, title: l.title }))];
function stairs() {
  q('#stairs').innerHTML = STAGES.map(st => {
    const c = cum(st.n), cls = st.n <= done ? 'on' : st.n === done + 1 ? 'next' : '';
    const lbl = st.n === 0 ? ['Just starting', 'No levels yet'] : [st.short, st.title];
    const shortL = st.n === 0 ? 'New' : st.short;
    const note = st.n === done + 1 ? 'Next goal' : '';
    return `<button class="st ${cls}" type="button" role="radio" aria-checked="${st.n === done}" data-n="${st.n}" style="--h:${c / S.length};--k:${st.n}" aria-label="${esc(st.name)}, ${U.plural(c, 'surah', 'surahs')} open${note ? ', next goal' : ''}">
      <span class="bar" aria-hidden="true"><b>${c}</b><small>${c === 1 ? 'surah' : 'surahs'}<br>${note}</small></span>
      <span class="lbl" aria-hidden="true"><b><span class="lg">${lbl[0]}</span><span class="sh">${shortL}</span></b><span>${esc(lbl[1])}</span></span></button>`;
  }).join('');
  q('#stairs').querySelectorAll('.st').forEach(b => b.addEventListener('click', () => { done = +b.dataset.n; try { localStorage.setItem('surahs.done', done); } catch (e) {} render(); }));
}
q('#stairs').addEventListener('keydown', e => {
  const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
  if (!d) return; e.preventDefault();
  done = Math.min(LV, Math.max(0, done + d)); render(); q(`.st[data-n="${done}"]`).focus();
});

const rowHTML = s => `<a class="rw" href="${U.link(s)}" data-num="${s.num}">
  <span class="ar nm" lang="ar" dir="rtl">${esc(s.ar)}</span>
  <span class="t"><b>${esc(s.name)}</b><span>${U.plural(s.verses, 'verse', 'verses')} · ${s.rev} · Level ${s.level}</span></span>
  <span class="q op" lang="ar" dir="rtl">${esc(s.open)}</span>
  <span class="go">${U.ICON.arrow}</span></a>`;

function featureHTML(s, label) {
  const c = s.comp;
  return `<article class="feature" data-num="${s.num}"><div>
      <div class="tags"><span class="tag start">${label}</span><span class="tag plain">Surah ${s.num}</span></div>
      <span class="ar nm" lang="ar" dir="rtl">${esc(s.ar)}</span>
      <p class="en">${esc(s.name)}</p><p class="meta">${U.plural(s.verses, 'verse', 'verses')} · ${s.rev} · read after Level ${s.level}</p>
    </div><div class="right">
      <p class="q op" lang="ar" dir="rtl">${esc(s.open)}</p>
      <p class="nt">${U.withArabic(s.note)}</p>
      <div class="made">${U.compHTML(s)}<p>${c.words} words: ${c.noun} nouns, ${c.verb} verbs, ${c.little} little words.</p></div>
      <div class="act"><a class="btn" href="${U.link(s)}">Read ${esc(s.name)} word by word ${U.ICON.arrow}</a></div>
    </div></article>`;
}

let find;
function render() {
  stairs();
  const ready = S.filter(s => s.level <= done), next = at(done + 1);
  const fresh = at(done), featured = done === 0 ? null : (fresh[0] || ready[ready.length - 1]);
  q('#rh').textContent = done === 0 ? `Your first ${at(1).length} surahs open after Level 1.` : done === LV ? `All ${S.length} surahs are open to you.` : `You can read ${ready.length} surahs today.`;
  q('#rs').textContent = done === 0
    ? `Nothing is locked, so you can open any surah to see how it works. These are the first ones the course prepares you for.`
    : `Nothing is locked. This is the order the course prepares you for, newest first.`;
  let html = '';
  if (featured) html += featureHTML(featured, fresh.length ? `Just opened by Level ${done}` : 'Start here');
  const rest = ready.filter(s => s !== featured).sort((a, b) => b.level - a.level || a.num - b.num);
  if (rest.length) html += `<h3 class="sub">Also open to you<span>${U.plural(rest.length, 'surah', 'surahs')}</span></h3><div class="rows">${rest.map(rowHTML).join('')}</div>`;
  if (done === 0) {
    const first = at(1);
    html += `<h3 class="sub">Opens after Level 1<span>${D.levels[0].title}: ${esc(D.levels[0].blurb)}</span></h3><div class="rows">${first.map(rowHTML).join('')}</div>`;
  }
  if (done >= 1 && done < LV) {
    const nl = D.levels[done];
    html += `<section class="goal" aria-labelledby="gh"><h3 id="gh">Finish Level ${nl.n}: ${esc(nl.title)} to open ${U.plural(next.length, 'more surah', 'more surahs')}.</h3>
      <p>${esc(nl.blurb)}</p>
      <ul class="cloud">${next.map(s => `<li data-num="${s.num}"><a href="${U.link(s)}"><span class="ar" lang="ar" dir="rtl">${esc(s.ar)}</span><small>${esc(s.name)}</small></a></li>`).join('')}</ul>
      <a class="btn" href="#">Go to Level ${nl.n} ${U.ICON.arrow}</a></section>`;
  }
  if (done === 0) html += `<div class="goal" style="margin-top:32px"><h3>Start with Level 1: ${esc(D.levels[0].title)}.</h3><p>${esc(D.levels[0].blurb)} Short lessons, and you can stop at any point.</p><div style="margin-top:20px"><a class="btn" href="#">Start Level 1 ${U.ICON.arrow}</a></div></div>`;
  const ahead = D.levels.filter(l => l.n > done + 1);
  if (ahead.length) html += `<h3 class="sub">Further ahead<span>These come after more of the course.</span></h3><ul class="ahead">${ahead.map(l => `<li><h4>Read after Level ${l.n}<span>${esc(l.title)} · ${U.plural(at(l.n).length, 'surah', 'surahs')}</span></h4><div class="names">${at(l.n).map(s => `<a href="${U.link(s)}" data-num="${s.num}" lang="ar" dir="rtl" aria-label="${esc(s.name)}">${esc(s.ar)}</a>`).join('')}</div></li>`).join('')}</ul>`;
  if (done === LV) html += `<p class="count" style="margin-top:32px">The other ${U.covers.missing} surahs of the Quran are not analysed yet.</p>`;
  q('#out').innerHTML = html;
  q('#stairs').classList.remove('enter');
  refresh();
}

const by = Object.fromEntries(S.map(s => [s.num, s]));
function refresh() {
  const ws = U.words(find ? find.value : ''); const filtering = ws.length > 0;
  document.body.classList.toggle('filtering', filtering);
  let shown = new Set();
  q('#out').querySelectorAll('[data-num]').forEach(el => { const ok = U.textMatch(by[el.dataset.num], ws, true); el.hidden = !ok; if (ok) shown.add(el.dataset.num); });
  q('#out').querySelectorAll('.goal,.ahead li,.rows').forEach(e => { if (!e.querySelector('[data-num]')) return; e.hidden = !e.querySelector('[data-num]:not([hidden])'); });
  q('#out').querySelectorAll('.sub').forEach(h => { const n = h.nextElementSibling; h.hidden = !!n && n.hidden; });
  q('#count').textContent = filtering ? `${shown.size} of ${S.length} surahs match` : '';
  q('#empty').hidden = !filtering || shown.size !== 0;
  if (filtering) { q('#rh').textContent = `Matching surahs`; q('#rs').textContent = 'Every surah is open to you. The level tag shows when the course prepares you for it.'; }
}
find = U.wireFind(refresh);
q('#reset').addEventListener('click', () => { find.clear(); render(); });
find.input.addEventListener('input', () => { if (!find.value) render(); });
if (!params.has('done')) { try { const v = localStorage.getItem('surahs.done'); if (v !== null) done = Math.min(LV, Math.max(0, +v)); } catch (e) {} }
render();
</script>
</body></html>
