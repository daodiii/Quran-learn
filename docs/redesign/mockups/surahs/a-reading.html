<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surahs · A Reading list</title>
<link rel="stylesheet" href="surahs.css">
<style>
/* A Reading list: a typeset, Arabic-forward list in the order the course prepares you for it.
   One level per section; the level stays put on the left while you read its surahs. */
.panel{margin-top:8px;border-radius:32px;background:var(--oasis);padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:clamp(28px,5vw,72px);align-items:end}
.panel .dek{color:oklch(33% 0.03 230)}
.panel .find{margin-top:clamp(24px,3.5vw,40px);max-width:680px}
.panel .chips{margin-top:16px}
.panel .chip{background:oklch(100% 0 0 / .72)}
.panel .chip[aria-pressed="true"]{background:var(--ink)}
.panel .count{margin-top:16px;color:oklch(33% 0.03 230)}

.begin{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:26px 28px 28px;border-radius:24px;background:oklch(100% 0 0 / .86);box-shadow:0 1px 2px oklch(30% 0.03 220 / .06),0 12px 32px oklch(30% 0.05 200 / .08);text-decoration:none}
.begin .nm{font-size:3.5rem;line-height:1.35;margin-top:8px;align-self:stretch;text-align:left}
.begin .en{font-weight:600;font-size:1.25rem;letter-spacing:-.02em}
.begin .meta{color:var(--muted);font-size:.9375rem;margin-top:-2px}
.begin .op{font-size:2rem;line-height:1.9;align-self:stretch;text-align:left;margin-top:10px;color:var(--text)}
.begin .btn{margin-top:14px}

.lvl{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:clamp(24px,5vw,88px);padding-block:clamp(40px,6vw,76px);border-top:1px solid var(--edge)}
.lvl:first-child{border-top:0}
.lvl-head{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:10px}
.after{margin:0;font-size:.9375rem;color:var(--muted)}
.num-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.num{font-weight:600;font-size:clamp(5.5rem,3rem + 7vw,9rem);letter-spacing:-.07em;line-height:.78;margin-left:-.04em}
.num-row .ar{font-size:clamp(1.75rem,1.4rem + 1vw,2.25rem);line-height:1.5;color:var(--accent);padding-bottom:2px}
.lvl-head h2{margin:8px 0 0;font-size:1.625rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.blurb{margin:0;color:oklch(32% 0.025 230);max-width:24em}
.lvl-head .count{margin-top:2px}

.rows{display:flex;flex-direction:column}
.s{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1.1fr) 36px;grid-template-areas:"n en arw go" "n nt arw go";column-gap:clamp(12px,2vw,28px);row-gap:6px;align-items:start;padding:22px 14px;border-top:1px solid var(--soft-2);text-decoration:none;border-radius:0;transition:background-color .18s}
.s:first-child{border-top-color:transparent}
.s:hover{background:var(--soft);border-radius:18px;border-top-color:transparent}
.s:hover + .s{border-top-color:transparent}
.s .n{grid-area:n;padding-top:6px;font-size:.9375rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.s .en{grid-area:en;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;align-self:end;min-width:0}
.s .en b{font-weight:600;font-size:1.25rem;letter-spacing:-.02em;line-height:1.3}
.s .meta{flex-basis:100%;font-size:.9375rem;color:var(--muted)}
.s .nt{grid-area:nt;margin:0;font-size:.9375rem;line-height:1.7;color:oklch(35% 0.025 230);max-width:46ch}
.s .nt .ar{font-size:1.2em}
.s .arw{grid-area:arw;display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.s .nm{font-size:2.75rem;line-height:1.45;color:var(--ink);text-align:right}
.s .op{font-size:1.75rem;line-height:1.95;color:var(--text);text-align:right}
.s .go{grid-area:go;align-self:center;justify-self:end;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:background-color .18s,color .18s}
.s .go svg{width:18px;height:18px;transition:transform .2s var(--ease)}
.s:hover .go{background:var(--ink);color:#fff}
.s:hover .go svg{transform:translateX(2px)}
.tag.start{min-height:24px}

.filtering .panel{padding-block:20px;grid-template-columns:1fr}
.filtering .panel .begin,.filtering .panel .dek{display:none}
.filtering .panel .h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filtering .panel .find{margin-top:0}
.filtering .lvl{padding-block:clamp(24px,3vw,40px)}
.filtering .lvl .num{font-size:clamp(3rem,2rem + 3vw,4.5rem)}
.filtering .lvl-head .blurb,.filtering .lvl-head .after,.filtering .lvl-head .count{display:none}

@media (max-width:1000px){
  .panel{grid-template-columns:1fr;align-items:start}
  .begin{display:none}
}
@media (max-width:860px){
  .s{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"n en nm" "n op op" "n nt nt";padding:18px 6px;row-gap:2px}
  .s .arw{display:contents}
  .s .nm{grid-area:nm;font-size:2.25rem;line-height:1.3;align-self:center}
  .s .op{grid-area:op;font-size:1.625rem;line-height:1.9;margin-top:4px;text-align:right}
  .s .nt{margin-top:4px;max-width:none}
  .s .go{display:none}
  .s .n{padding-top:4px}
}
@media (max-width:760px){
  .lvl{grid-template-columns:1fr;gap:12px;padding-block:28px}
  .lvl-head{position:static;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:2px;align-items:center}
  .num-row{display:contents}
  .num{font-size:3.5rem;grid-row:1 / span 3;line-height:.9}
  .num-row .ar{grid-column:2;grid-row:3;justify-self:start;font-size:1.375rem;line-height:1.4;padding:0}
  .after{grid-column:2;grid-row:1;font-size:.875rem}
  .lvl-head h2{grid-column:2;grid-row:2;margin:0;font-size:1.25rem}
  .lvl-head .blurb,.lvl-head .count{grid-column:1 / -1}
  .lvl-head .blurb{margin-top:8px}
  .lvl-head .count{display:none}
  .panel{border-radius:24px;padding:20px 16px 18px}
  .dek-more{display:none}
  body:not(.filtering) .panel .count{display:none}
  .panel .h1{font-size:2rem}
  .lvl-head .blurb{display:none}
  .panel .count{margin-top:10px}
  .panel .find{margin-top:18px}
  .panel .chips{margin-top:12px;flex-wrap:nowrap;gap:6px}
  .panel .chips-l{display:none}
  .panel .chip{flex:1 1 0;min-width:44px;padding:0 6px}
}
</style></head>
<body>
<a class="skip" href="#list">Skip to the surahs</a>
<header class="site">
  <a class="brand" href="#" aria-label="Quranic Grammar, home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="oklch(18% 0.03 240)"/><path d="M9 19h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2.6" fill="oklch(79% 0.14 72)"/><circle cx="16" cy="24.5" r="1.6" fill="#fff"/></svg><span>Quranic Grammar</span></a>
  <nav aria-label="Primary"><a href="#">Learn</a><a href="#" aria-current="page">Surahs</a><a href="#">Resources</a><a href="#">About</a></nav>
</header>

<main class="wrap" id="main">
  <section class="panel" id="top" aria-labelledby="h">
    <div>
      <h1 class="h1" id="h">Read a surah, word by word.</h1>
      <p class="dek" id="dek"></p>
      <div id="tools"></div>
      <div class="chips" id="chips" role="group" aria-label="Show level"></div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <a class="begin" id="start" href="#"></a>
  </section>
  <div id="list"></div>
</main>
<footer class="foot"><span>Quranic Grammar</span><a href="#">Learn</a><a href="#">Resources</a><a href="#">About and feedback</a></footer>

<script src="surahs-data.js"></script>
<script src="surahs.js"></script>
<script>
const U = SurahUI, D = U.D, S = U.S, esc = U.esc;
const first = S.filter(s => s.level === 1)[0];

document.querySelector('#dek').innerHTML = `${U.covers.sentence}. The other ${U.covers.missing} are not analysed yet.<span class="dek-more"> Each surah comes after the level that prepares you for it, with a line on what to notice.</span>`;
document.querySelector('#tools').innerHTML = U.findHTML('Name, number or topic');
document.querySelector('#chips').innerHTML = `<span class="chips-l" aria-hidden="true">Level</span>
  <button class="chip" type="button" data-lv="0" aria-pressed="true" aria-label="All levels">All</button>` +
  D.levels.map(l => `<button class="chip" type="button" data-lv="${l.n}" aria-pressed="false" aria-label="Level ${l.n}, ${esc(l.title)}">${l.n}</button>`).join('');

const start = document.querySelector('#start');
start.href = U.link(first);
start.setAttribute('aria-label', `Start here: ${first.name}`);
start.innerHTML = `<span class="tag start">Start here</span>
  <span class="ar nm" lang="ar" dir="rtl">${esc(first.ar)}</span>
  <span class="en">${esc(first.name)}</span>
  <span class="meta">${first.verses} verses · ${first.rev}</span>
  <span class="q op" lang="ar" dir="rtl">${esc(first.open)}</span>
  <span class="btn">Open ${esc(first.name)} ${U.ICON.arrow}</span>`;

const row = s => `<a class="s" href="${U.link(s)}" data-num="${s.num}" data-level="${s.level}">
  <span class="n" aria-hidden="true">${U.pad(s.num)}</span>
  <span class="en"><b>${esc(s.name)}</b>${s === first ? '<span class="tag start">Start here</span>' : ''}<span class="meta">${U.plural(s.verses, 'verse', 'verses')} · ${s.rev}</span></span>
  <span class="nt">${U.withArabic(s.note)}</span>
  <span class="arw"><span class="ar nm" lang="ar" dir="rtl">${esc(s.ar)}</span><span class="q op" lang="ar" dir="rtl">${esc(s.open)}</span></span>
  <span class="go">${U.ICON.arrow}</span>
</a>`;

document.querySelector('#list').innerHTML = D.levels.map(l => {
  const rows = S.filter(s => s.level === l.n);
  return `<section class="lvl" id="l${l.n}" data-level="${l.n}" aria-labelledby="h${l.n}">
    <div class="lvl-head">
      <p class="after">Read after</p>
      <div class="num-row"><span class="num" aria-hidden="true">${l.n}</span><span class="ar" lang="ar" dir="rtl">${esc(l.ar)}</span></div>
      <h2 id="h${l.n}">Level ${l.n}: ${esc(l.title)}</h2>
      <p class="blurb">${esc(l.blurb)}</p>
      <p class="count">${U.plural(rows.length, 'surah', 'surahs')}</p>
    </div>
    <div class="rows">${rows.map(row).join('')}</div>
  </section>`;
}).join('') + U.emptyHTML();

let lv = 0;
const chips = [...document.querySelectorAll('.chip[data-lv]')];
const count = document.querySelector('#count');
const list = document.querySelector('#list');
const empty = document.querySelector('#empty');
function refresh() {
  const ws = U.words(find.value);
  const filtering = ws.length > 0 || lv !== 0;
  document.body.classList.toggle('filtering', filtering);
  let shown = 0;
  list.querySelectorAll('.s').forEach(a => {
    const s = S.find(x => x.num === +a.dataset.num);
    const ok = (lv === 0 || s.level === lv) && U.textMatch(s, ws, true);
    a.hidden = !ok; if (ok) shown++;
  });
  list.querySelectorAll('.lvl').forEach(sec => { sec.hidden = !sec.querySelector('.s:not([hidden])'); });
  count.textContent = filtering ? `${shown} of ${S.length} surahs` : `${S.length} surahs in ${D.levels.length} levels`;
  empty.hidden = shown !== 0;
}
const find = U.wireFind(refresh);
chips.forEach(c => c.addEventListener('click', () => {
  lv = +c.dataset.lv;
  chips.forEach(o => o.setAttribute('aria-pressed', String(o === c)));
  refresh();
}));
document.querySelector('#reset').addEventListener('click', () => { lv = 0; chips.forEach((o, i) => o.setAttribute('aria-pressed', String(i === 0))); find.clear(); });
refresh();
</script>
</body></html>
