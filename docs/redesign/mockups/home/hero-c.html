<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home hero C · Ask the Quran</title>
<link rel="stylesheet" href="home.css">
<style>
.hero{max-width:1360px;margin:0 auto;padding:clamp(24px,5vh,56px) var(--gutter) 72px}
.top{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,72px);align-items:end}
.top .h1{font-size:clamp(2rem,1.1rem + 3vw,4.25rem);max-width:12em}
.side .sub{max-width:27em}
.side .cta-row{margin-top:22px}
.side .fine{margin-top:12px}

/* the dark surface: a working tool inside the light page, not a theme */
.win{--win:oklch(20% 0.035 232);--win-2:oklch(25% 0.036 232);--win-line:oklch(38% 0.03 232);--win-text:oklch(96% 0.006 215);--win-muted:oklch(79% 0.025 220);--win-teal:oklch(83% 0.11 178);--win-amber:oklch(85% 0.12 82);
  margin-top:clamp(22px,4vh,40px);background:var(--win);color:var(--win-text);border-radius:28px;padding:clamp(16px,2.4vw,30px)}
.bar{display:flex;align-items:center;gap:14px;background:var(--win-2);border:1.5px solid var(--win-line);border-radius:18px;padding:0 clamp(14px,2vw,22px);min-height:64px}
.bar:focus-within{border-color:var(--win-teal)}
.bar svg{width:24px;height:24px;flex:none;color:var(--win-muted)}
.bar input{flex:1;min-width:0;background:none;border:0;color:var(--win-text);font:inherit;font-size:clamp(1.25rem,1rem + 1vw,1.75rem);letter-spacing:-.01em;min-height:60px;outline:none}
.bar input::placeholder{color:var(--win-muted)}
.bar .lang{font-size:.875rem;color:var(--win-muted);border:1px solid var(--win-line);border-radius:8px;padding:3px 10px;white-space:nowrap}
.try{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0;font-size:1rem;color:var(--win-muted)}
.try button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--win-line);background:transparent;color:var(--win-text);cursor:pointer;transition:background-color .2s,border-color .2s}
.try button:hover,.try button[aria-pressed="true"]{background:var(--win-2);border-color:var(--win-teal)}
.try :focus-visible,.bar input:focus-visible,.open:focus-visible{outline:3px solid var(--win-teal)}
.res{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(18px,3vw,44px);margin-top:clamp(16px,2.4vw,26px);padding-top:clamp(16px,2.4vw,26px);border-top:1px solid var(--win-line)}
.hit{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hit .word{font-size:clamp(4rem,7.2vw,6.5rem);line-height:1.4;margin:0;color:var(--win-text);text-align:left}
.hit .tr{margin:0;color:var(--win-muted)}
.hit .gl{margin:2px 0 0;font-size:clamp(1.375rem,1rem + 1vw,1.875rem);font-weight:500;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px}
.root{display:flex;gap:6px;direction:rtl}
.root .ar{display:grid;place-items:center;width:40px;height:44px;border-radius:10px;border:1.5px solid var(--win-teal);color:var(--win-teal);font-size:1.5rem;line-height:1}
.cnt{color:var(--win-amber);font-weight:500}
.open{display:inline-flex;margin-top:14px;color:var(--win-teal);text-underline-offset:4px}
.fam h3{margin:0 0 10px;font-size:1rem;font-weight:500;color:var(--win-muted)}
.fam ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.fam li{display:grid;grid-template-columns:minmax(84px,.8fr) minmax(0,1.6fr) 3.4em;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--win-line)}
.fam li:last-child{border-bottom:0}
.fam .ar{font-size:1.5rem;line-height:1.3;color:var(--win-text)}
.fam .g{font-size:.9375rem;color:var(--win-muted);display:flex;flex-direction:column;gap:5px}
.fam .bar2{height:6px;border-radius:3px;background:var(--win-2);overflow:hidden}
.fam .bar2 i{display:block;height:100%;width:var(--w);background:var(--win-teal);border-radius:3px;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fam .n{text-align:right;font-size:.9375rem;font-variant-numeric:tabular-nums;color:var(--win-text)}
.ex{margin-top:clamp(14px,2vw,22px);padding-top:clamp(14px,2vw,20px);border-top:1px solid var(--win-line);display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.ex .ar{font-size:clamp(2rem,3.4vw,2.875rem);line-height:1.5;margin:0}
.ex mark{background:none;color:var(--win-teal);box-shadow:inset 0 -.1em 0 var(--win-teal)}
.ex p{margin:0;color:var(--win-muted);font-size:.9375rem}
.ex .en{color:var(--win-text);font-size:1.0625rem}
.refs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ref{border:1px solid var(--win-line);border-radius:8px;padding:2px 10px;color:var(--win-text);font-size:.9375rem}
.none{margin:6px 0 0;color:var(--win-muted)}
@media (max-width:980px){.top{grid-template-columns:1fr;align-items:start}.res{grid-template-columns:1fr}}
@media (max-width:520px){.side .cta-row .btn{flex:1 1 100%}.bar .lang{display:none}.fam li{grid-template-columns:minmax(70px,.8fr) minmax(0,1.6fr) 3em}}
</style></head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="site">
  <a class="brand" href="#"><img src="../../../../public/favicon.svg" alt="">Quranic Grammar</a>
  <nav aria-label="Primary"><a href="#">Learn</a><a href="#">Surahs</a><a href="#">Resources</a><a href="#">About</a></nav>
  <a class="btn small primary start" href="#">Start learning</a>
</header>

<main id="main">
<section class="hero">
  <div class="top">
    <h1 class="h1">Understand the Holy Quran for Free.</h1>
    <div class="side">
      <p class="sub">Learn the grammar of Quranic Arabic word by word, starting from the alphabet.</p>
      <div class="cta-row">
        <a class="btn primary" href="#">Start with the alphabet</a>
        <a class="btn" href="#">I can already read Arabic</a>
      </div>
      <p class="fine">Free. No sign-up. No ads.</p>
    </div>
  </div>

  <div class="win">
    <form class="bar" role="search" onsubmit="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="vh" for="q">Search the Quran by an English word</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Type an English word, like mercy">
      <span class="lang">English → Arabic</span>
    </form>
    <p class="try" id="try" role="group" aria-label="Try these words"></p>
    <div class="res" id="res" aria-live="polite"></div>
    <div id="ex"></div>
  </div>
</section>
</main>

<script>
const D={
 knowledge:{ar:'عِلْم',tr:'ʿilm',g:'knowledge',root:'ع ل م',rl:'ʿ-l-m',n:105,rt:854,fm:14,refs:['4:157','6:100','6:108'],
  fam:[['عَلِمَ','to know',382],['عَلِيم','all-knowing',163],['عِلْم','knowledge',105],['عَٰلَمِين','worlds',73],['أَعْلَم','more knowing',49],['عَلَّمَ','to teach',41]],
  verse:true},
 mercy:{ar:'رَحْمَة',tr:'raḥma',g:'mercy',root:'ر ح م',rl:'r-ḥ-m',n:114,rt:339,fm:9,refs:['3:8','10:21','11:9'],
  fam:[['رَحِيم','most merciful',116],['رَحْمَة','mercy',114],['رَحْمَٰن','the Most Gracious',57],['رَحِمَ','to show mercy',28],['أَرْحَام','wombs, kinship',12],['رَٰحِمِين','those who show mercy',6]]},
 guidance:{ar:'هُدًى',tr:'hudā',g:'guidance',root:'ه د ي',rl:'h-d-y',n:85,rt:316,fm:12,refs:['2:5','22:8','22:67'],
  fam:[['هَدَى','to guide',144],['هُدًى','guidance',85],['اهْتَدَىٰ','to be guided',40],['مُهْتَدُون','the guided',17],['هَدْي','offering',7],['أَهْدَىٰ','better guided',7]]},
 book:{ar:'كِتَٰب',tr:'kitāb',g:'book, scripture',root:'ك ت ب',rl:'k-t-b',n:260,rt:319,fm:7,refs:['2:44','2:53','2:78'],
  fam:[['كِتَٰب','book, scripture',260],['كَتَبَ','to write',49],['كَاتِب','scribe',6],['مَكْتُوب','written',1],['اكْتَتَبَ','to copy out',1]]}
};
const $=id=>document.getElementById(id),q=$('q'),res=$('res'),ex=$('ex'),tryEl=$('try');
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{q.value=k;go(k)});tryEl.appendChild(b)});
function find(v){v=v.trim().toLowerCase();if(!v)return null;return Object.keys(D).find(k=>k.startsWith(v)||D[k].g.includes(v))||null}
function go(v){
  const k=find(v);
  [...tryEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===k)));
  if(!k){res.innerHTML=v.trim()?`<p class="none">No entry for “${v.replace(/[<>&]/g,'')}” in this preview. Try knowledge, mercy, guidance or book.</p>`:'';ex.innerHTML='';return}
  const d=D[k],max=d.fam[0][2];
  res.innerHTML=`<div class="hit"><p class="word ar" lang="ar" dir="rtl">${d.ar}</p><p class="tr">${d.tr}</p><p class="gl">${d.g}</p>
   <div class="meta"><span class="root ar" lang="ar" aria-label="Root ${d.rl}">${d.root.split(' ').map(x=>`<span class="ar">${x}</span>`).join('')}</span><span class="cnt">${d.n} times in the Quran</span></div></div>
   <div class="fam"><h3>Same root ${d.rl}: ${d.rt} times in ${d.fm} word families</h3><ul>${d.fam.map(f=>`<li><span class="ar" lang="ar" dir="rtl">${f[0]}</span><span class="g">${f[1]}<span class="bar2"><i style="--w:${(f[2]/max*100).toFixed(0)}%"></i></span></span><span class="n">${f[2]}</span></li>`).join('')}</ul><a class="open" href="#">Open the full entry →</a></div>`;
  ex.innerHTML=d.verse
   ?`<div class="ex"><p class="ar" lang="ar" dir="rtl">رَبِّ زِدْنِى <mark>عِلْمًا</mark></p><div><p class="en">“My Lord, increase me in knowledge.”</p><p>Taha 20:114 · ʿilman, the last word, comes from this root.</p></div></div>`
   :`<div class="ex"><p>Seen at, for example</p><div class="refs">${d.refs.map(r=>`<span class="ref">${r}</span>`).join('')}</div></div>`;
}
q.addEventListener('input',()=>go(q.value));
const word='knowledge';
if(matchMedia('(prefers-reduced-motion: reduce)').matches){q.value=word;go(word)}
else{let i=0;const t=setInterval(()=>{q.value=word.slice(0,++i);go(q.value);if(i>=word.length)clearInterval(t)},85)}
</script>
</body></html>
